[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercast4d"
version = "0.2.0"
description = "Clean-room evaluation of 4D hypercomplex time-series forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "HyperCast4D contributors"}]
dependencies = [
  "einops>=0.8,<1",
  "scipy>=1.13,<2",
  "fastapi>=0.115",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tensorboard>=2.16,<2.21",
  "torch>=2.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx2>=2.0", "pytest>=8.0"]
modal = ["modal>=1.4,<2"]

[project.scripts]
hypercast4d-dashboard = "hypercast4d.dashboard:main"
hypercast4d-download = "hypercast4d.download:main"
hypercast4d-playground = "hypercast4d.playground:main"
hypercast4d-run = "hypercast4d.experiment:main"
hypercast4d-reproduce = "hypercast4d.reproduction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hypercast4d = ["web_dist/**", "_vendor/**/LICENSE", "_vendor/**/PROVENANCE.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
