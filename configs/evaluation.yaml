data:
  path: data/raw/paper_data.xlsx
  target_column: Copper
  train_fraction: 0.70
  validation_fraction: 0.15

experiment:
  output_dir: results/evaluation
  cells:
    - {window: 10, horizon: 1}
    - {window: 20, horizon: 5}
    - {window: 60, horizon: 20}
  seeds: [7, 19, 31, 43, 59]
  quick:
    cell_count: 1
    seed_count: 1
    epochs: 3

training:
  # Paper: Adam, MSE, 50 epochs, Keras default batch size 32, shuffled batches.
  optimizer:
    name: adam
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-7
    amsgrad: false
  loss: mse
  batch_size: 32
  evaluation_batch_size: 256
  epochs: 50
  shuffle: true
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
  restore_best_weights: false
  device: cpu

models:
  enabled:
    - persistence
    - linear
    - cnn
    - lstm
    - hyper_quaternion
    - hyper_coquaternion
    - hyper_cl11
  # Concrete points inside the paper's grid-search spaces. Settings are kept
  # separate because the paper selected them independently for each model.
  cnn:
    units: 16
    kernel_size: 3
    dense_before_pool: true
    dense_after_pool: true
    dense_units: 32
    activation: relu
    dropout: 0.50
    pool_size: 2
  lstm:
    units: 16
    dense_before_pool: true
    dense_after_pool: true
    dense_units: 32
    activation: relu
    dropout: 0.50
    pool_size: 2
  hyper:
    units: 8
    dense_before_pool: true
    dense_after_pool: true
    dense_units: 32
    activation: relu
    dropout: 0.50
    pool_size: 2
